<!-- SUB-PESTAÑA 4: EMOJIS PERSONALIZADOS (GALERÍA PRIMERO, EN 1 COLUMNA) -->
<div x-data="{ creatorOpen: false, openEmojiMenu: false, activeFormTab: 'single', isDragOver: false, batchCatInput: 'General' }"
  class="space-y-5">

  <div class="wiki-settings-pane-head flex flex-wrap items-end justify-between gap-3">
    <div>
      <h2 class="wiki-settings-pane-title">Emojis Personalizados</h2>
      <p class="wiki-settings-pane-desc">Tus propios iconos (PNG, GIF, WebP) para usar con <code class="font-mono">:nombre:</code> en las fichas.</p>
    </div>

    <!-- Inputs ocultos preservados -->
    <input type="file" id="import-emojis-json-input" accept=".json" class="hidden"
      @change="$store.customEmojis.importJsonFile($event)">
    <input type="file" id="batch-emoji-uploader" multiple
      accept="image/png,image/gif,image/webp,image/jpeg,image/svg+xml,image/apng,.gif,.png,.webp,.jpg,.jpeg,.svg,.apng"
      class="hidden" @change="$store.customEmojis.handleBatchUpload($event)">

    <div class="flex flex-wrap items-center gap-2">
      <button type="button"
        @click="activeFormTab = 'single'; creatorOpen = !creatorOpen"
        class="souls-btn souls-btn-primary">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        <span x-text="(creatorOpen || $store.customEmojis.editingEmojiId) ? 'Cerrar formulario' : 'Añadir emoji'"></span>
      </button>

      <button type="button" @click="$store.steamEmojis.open('packs')" class="souls-btn">
        <i data-lucide="steam" class="w-3.5 h-3.5"></i>
        <span>Steam</span>
      </button>

      <div class="relative" @click.outside="openEmojiMenu = false">
        <button type="button" @click="openEmojiMenu = !openEmojiMenu" class="souls-btn !px-2.5" title="Más opciones">
          <i data-lucide="more-horizontal" class="w-4 h-4"></i>
        </button>

        <div x-show="openEmojiMenu" x-cloak
          class="absolute right-0 top-full mt-1 w-52 p-1 border shadow-xl z-30 space-y-0.5 text-xs"
          style="background: var(--wiki-bg-elevated); border-color: var(--wiki-border-strong);">
          <button type="button" @click="document.getElementById('batch-emoji-uploader').click(); openEmojiMenu = false"
            class="w-full text-left px-2.5 py-2 hover:bg-white/10 flex items-center gap-2 cursor-pointer"
            style="color: var(--wiki-text-main);">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            <span>Subir varios a la vez</span>
          </button>
          <button type="button" @click="document.getElementById('import-emojis-json-input').click(); openEmojiMenu = false"
            class="w-full text-left px-2.5 py-2 hover:bg-white/10 flex items-center gap-2 cursor-pointer"
            style="color: var(--wiki-text-main);">
            <i data-lucide="upload" class="w-3.5 h-3.5"></i>
            <span>Importar JSON</span>
          </button>
          <button type="button" @click="$store.customEmojis.exportJson(); openEmojiMenu = false"
            class="w-full text-left px-2.5 py-2 hover:bg-white/10 flex items-center gap-2 cursor-pointer"
            style="color: var(--wiki-text-main);">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
            <span>Exportar colección</span>
          </button>
          <button type="button" @click="$store.customEmojis.openPicker(); openEmojiMenu = false"
            class="w-full text-left px-2.5 py-2 hover:bg-white/10 flex items-center gap-2 cursor-pointer"
            style="color: var(--wiki-text-main);">
            <i data-lucide="scan" class="w-3.5 h-3.5"></i>
            <span>Probar selector</span>
          </button>
          <div class="px-2.5 py-1.5 text-[11px] border-t font-mono"
            style="border-color: var(--wiki-border); color: var(--wiki-text-muted);"
            x-text="`${$store.customEmojis.totalCount} / ${$store.customEmojis.maxCapacity} (${$store.customEmojis.estimatedMemoryFormatted})`"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- CREADOR / EDITOR COLAPSABLE -->
  <div id="emoji-editor-form-card"
    x-show="creatorOpen || !!$store.customEmojis.editingEmojiId"
    x-cloak
    class="wiki-settings-section space-y-4">

    <div class="flex items-center justify-between gap-2 pb-2 border-b" style="border-color: var(--wiki-border);">
      <div class="wiki-segmented">
        <button type="button" @click="activeFormTab = 'single'"
          :class="{ 'is-active': activeFormTab === 'single' }"
          class="wiki-segmented-btn">Uno solo</button>
        <button type="button" @click="activeFormTab = 'batch'"
          :class="{ 'is-active': activeFormTab === 'batch' }"
          class="wiki-segmented-btn">Subir varios</button>
      </div>

      <button type="button"
        @click="creatorOpen = false; if ($store.customEmojis.editingEmojiId) $store.customEmojis.resetForm()"
        class="souls-btn !p-1.5" title="Cerrar">
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>

    <!-- MODO INDIVIDUAL -->
    <div x-show="activeFormTab === 'single'" class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center gap-4">
        <div class="w-16 h-16 shrink-0 flex items-center justify-center border p-1.5"
          style="background: var(--wiki-bg-outer); border-color: var(--wiki-border);">
          <template x-if="$store.customEmojis.formPreview">
            <img :src="$store.customEmojis.formPreview" alt="Vista previa"
              @error="$store.customEmojis.handlePreviewError()"
              class="max-w-full max-h-full object-contain select-none" />
          </template>
          <template x-if="!$store.customEmojis.formPreview">
            <i data-lucide="image" class="w-5 h-5 opacity-40"></i>
          </template>
        </div>

        <div class="flex-1 space-y-2 min-w-0">
          <input type="file" id="emoji-file-uploader"
            accept="image/png,image/gif,image/webp,image/jpeg,image/svg+xml,image/apng,.gif,.png,.webp,.jpg,.jpeg,.svg,.apng"
            class="hidden" @change="$store.customEmojis.handleFileUpload($event)">

          <div class="flex flex-wrap items-center gap-2">
            <button type="button" @click="document.getElementById('emoji-file-uploader').click()" class="souls-btn">
              <i data-lucide="upload" class="w-3.5 h-3.5"></i>
              <span x-text="$store.customEmojis.isProcessingFile ? 'Procesando...' : 'Elegir imagen'"></span>
            </button>
            <template x-if="$store.customEmojis.formPreview">
              <button type="button" @click="$store.customEmojis.openCropperForCurrentEmoji()" class="souls-btn">
                <i data-lucide="crop" class="w-3.5 h-3.5"></i>
                <span>Recortar 1:1</span>
              </button>
            </template>
          </div>

          <input type="url" x-model="$store.customEmojis.formUrl"
            @input="$store.customEmojis.handleUrlInput()"
            @paste="setTimeout(() => $store.customEmojis.handleUrlInput(), 50)"
            @change="$store.customEmojis.handleUrlInput()"
            class="souls-input text-xs"
            placeholder="O pega un enlace directo: https://..." />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="space-y-1">
          <label class="text-xs font-semibold block">Código (ej: fuego)</label>
          <input type="text" x-model="$store.customEmojis.formShortcode"
            @input="$store.customEmojis.formShortcode = $store.customEmojis.sanitizeShortcode($event.target.value)"
            class="souls-input text-xs font-mono" placeholder="fuego_azul" maxlength="32" />
        </div>
        <div class="space-y-1">
          <label class="text-xs font-semibold block">Nombre</label>
          <input type="text" x-model="$store.customEmojis.formName"
            class="souls-input text-xs" placeholder="Descripción" maxlength="40" />
        </div>
        <div class="space-y-1">
          <label class="text-xs font-semibold block">Categoría</label>
          <input type="text" x-model="$store.customEmojis.formCategory" list="emoji-category-datalist"
            class="souls-input text-xs" placeholder="General" maxlength="24" />
          <datalist id="emoji-category-datalist">
            <option value="General"></option>
            <option value="Reacciones"></option>
            <option value="Combate"></option>
            <option value="Objetos"></option>
            <option value="Personaje"></option>
            <option value="Cyberpunk"></option>
            <option value="Gaming"></option>
            <option value="Social"></option>
          </datalist>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t" style="border-color: var(--wiki-border);">
        <template x-if="$store.customEmojis.editingEmojiId">
          <button type="button" @click="$store.customEmojis.resetForm()" class="souls-btn">Cancelar edición</button>
        </template>
        <button type="button" @click="$store.customEmojis.saveCurrentEmoji(); if (!$store.customEmojis.editingEmojiId) creatorOpen = false;"
          class="souls-btn souls-btn-primary">
          <i data-lucide="check" class="w-3.5 h-3.5"></i>
          <span x-text="$store.customEmojis.editingEmojiId ? 'Guardar cambios' : 'Guardar emoji'"></span>
        </button>
      </div>
    </div>

    <!-- MODO POR LOTE -->
    <div x-show="activeFormTab === 'batch'" x-cloak class="space-y-3">
      <div class="flex items-center gap-3">
        <label class="text-xs font-semibold shrink-0">Categoría:</label>
        <input type="text" x-model="batchCatInput" list="emoji-category-datalist"
          class="souls-input text-xs max-w-xs" placeholder="General" maxlength="24" />
      </div>

      <div class="wiki-settings-card border-dashed py-6 text-center cursor-pointer space-y-1.5"
        :style="isDragOver ? 'border-color: var(--wiki-accent); background: var(--wiki-accent-dim);' : ''"
        @dragover.prevent="isDragOver = true"
        @dragleave.prevent="isDragOver = false"
        @drop.prevent="isDragOver = false; $store.customEmojis.handleBatchUpload($event.dataTransfer.files, batchCatInput)"
        @click="document.getElementById('batch-emoji-uploader').click()">
        <i data-lucide="upload-cloud" class="w-6 h-6 mx-auto" style="color: var(--wiki-accent);"></i>
        <p class="text-xs font-semibold m-0">Arrastra varias imágenes aquí o haz clic</p>
        <p class="text-[11px] m-0" style="color: var(--wiki-text-muted);">Cada archivo usará su nombre como código.</p>
      </div>
    </div>
  </div>

  <!-- GALERÍA PRINCIPAL (ANCHO COMPLETO Y DESPEJADA) -->
  <section class="wiki-settings-section space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <div class="relative flex-1 min-w-[200px]">
        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
          style="color: var(--wiki-text-dim);"></i>
        <input type="text" x-model="$store.customEmojis.query"
          class="souls-input text-xs"
          style="padding-left: 32px !important; padding-right: 26px !important;"
          placeholder="Buscar por :código: o nombre..." />
        <button type="button" x-show="$store.customEmojis.query" @click="$store.customEmojis.query = ''"
          class="absolute right-2.5 top-1/2 -translate-y-1/2 cursor-pointer" style="color: var(--wiki-text-muted);">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <button type="button" @click="$store.customEmojis.toggleBatchMode()"
        class="souls-btn text-xs"
        :class="{ 'souls-btn-primary': $store.customEmojis.isBatchSelectMode }">
        <span x-show="$store.customEmojis.isBatchSelectMode" class="inline-flex"><i data-lucide="check-square" class="w-3.5 h-3.5"></i></span>
        <span x-show="!$store.customEmojis.isBatchSelectMode" class="inline-flex"><i data-lucide="square" class="w-3.5 h-3.5"></i></span>
        <span x-text="$store.customEmojis.isBatchSelectMode ? 'Terminar selección' : 'Seleccionar varios'"></span>
      </button>
    </div>

    <!-- Barra de selección múltiple -->
    <div x-show="$store.customEmojis.isBatchSelectMode" x-cloak
      class="wiki-settings-card flex flex-wrap items-center justify-between gap-2 text-xs">
      <div class="flex items-center gap-2">
        <strong class="font-mono" x-text="`${$store.customEmojis.selectedEmojiIds.length} seleccionados`"></strong>
        <button type="button" @click="$store.customEmojis.selectAllFiltered()" class="souls-btn !px-2 !py-1 text-xs">Todos</button>
        <button type="button" @click="$store.customEmojis.clearSelection()" class="souls-btn !px-2 !py-1 text-xs">Ninguno</button>
      </div>
      <div class="flex items-center gap-1.5" x-data="{ moveCategoryInput: '' }">
        <input type="text" x-model="moveCategoryInput" list="emoji-category-datalist"
          placeholder="Mover a categoría..." class="souls-input text-xs !w-36" />
        <button type="button"
          @click="$store.customEmojis.moveSelectedToCategory(moveCategoryInput); moveCategoryInput = '';"
          :disabled="$store.customEmojis.selectedEmojiIds.length === 0"
          class="souls-btn !px-2.5 !py-1 text-xs disabled:opacity-40">Mover</button>
        <button type="button"
          @click="$store.customEmojis.deleteSelectedEmojis()"
          :disabled="$store.customEmojis.selectedEmojiIds.length === 0"
          class="souls-btn souls-btn-danger !px-2.5 !py-1 text-xs disabled:opacity-40">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- Filtros -->
    <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
      <button type="button" @click="$store.customEmojis.selectedCategory = 'all'"
        class="souls-btn !px-2.5 !py-1 text-xs whitespace-nowrap shrink-0"
        :class="{ 'souls-btn-primary': $store.customEmojis.selectedCategory === 'all' }">
        Todos (<span x-text="$store.customEmojis.list.length"></span>)
      </button>

      <template x-if="$store.customEmojis.favoriteEmojis.length > 0">
        <button type="button" @click="$store.customEmojis.selectedCategory = 'favorites'"
          class="souls-btn !px-2.5 !py-1 text-xs whitespace-nowrap shrink-0"
          :class="{ 'souls-btn-primary': $store.customEmojis.selectedCategory === 'favorites' }">
          <i data-lucide="star" class="w-3 h-3"></i>
          <span>Favoritos (<span x-text="$store.customEmojis.favoriteEmojis.length"></span>)</span>
        </button>
      </template>

      <template x-for="cat in $store.customEmojis.categories" :key="'cat-' + cat">
        <button type="button" @click="$store.customEmojis.selectedCategory = cat"
          class="souls-btn !px-2.5 !py-1 text-xs whitespace-nowrap shrink-0"
          :class="{ 'souls-btn-primary': $store.customEmojis.selectedCategory === cat }"
          x-text="cat"></button>
      </template>
    </div>

    <!-- Vacío -->
    <template x-if="$store.customEmojis.list.length === 0">
      <div class="wiki-settings-card py-12 text-center space-y-2">
        <i data-lucide="smile" class="w-7 h-7 mx-auto opacity-50" style="color: var(--wiki-text-dim);"></i>
        <p class="text-sm font-semibold m-0">Todavía no has añadido emojis</p>
        <p class="text-xs m-0" style="color: var(--wiki-text-muted);">
          Pulsa «Añadir emoji» arriba o explora los packs de Steam.
        </p>
      </div>
    </template>

    <!-- Sin resultados -->
    <template x-if="$store.customEmojis.list.length > 0 && $store.customEmojis.filteredList.length === 0">
      <div class="wiki-settings-card py-8 text-center space-y-2">
        <p class="text-xs m-0" style="color: var(--wiki-text-muted);">Sin emojis para esta búsqueda.</p>
        <button type="button" @click="$store.customEmojis.query = ''; $store.customEmojis.selectedCategory = 'all';"
          class="souls-btn !px-3 !py-1 text-xs">Mostrar todos</button>
      </div>
    </template>

    <!-- Cuadrícula -->
    <template x-if="$store.customEmojis.filteredList.length > 0">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 max-h-[500px] overflow-y-auto pr-1">
        <template x-for="emoji in $store.customEmojis.filteredList" :key="emoji.id">
          <div class="wiki-settings-card !p-2.5 flex flex-col items-center justify-between gap-2 relative group transition-colors"
            :style="($store.customEmojis.isBatchSelectMode && $store.customEmojis.isEmojiSelected(emoji.id)) || $store.customEmojis.editingEmojiId === emoji.id
              ? 'border-color: var(--wiki-accent); background: var(--wiki-accent-dim);'
              : ''"
            @click="$store.customEmojis.isBatchSelectMode && $store.customEmojis.toggleSelectEmoji(emoji.id)">

            <template x-if="$store.customEmojis.isBatchSelectMode">
              <div class="absolute top-1.5 left-1.5" @click.stop>
                <input type="checkbox" :checked="$store.customEmojis.isEmojiSelected(emoji.id)"
                  @change="$store.customEmojis.toggleSelectEmoji(emoji.id)" class="cursor-pointer">
              </div>
            </template>

            <button type="button" @click.stop="$store.customEmojis.toggleFavorite(emoji.id)"
              class="absolute top-1.5 right-1.5 p-0.5 cursor-pointer transition-opacity"
              :class="$store.customEmojis.isFavorite(emoji.id) ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'"
              :style="$store.customEmojis.isFavorite(emoji.id) ? 'color: var(--wiki-accent);' : 'color: var(--wiki-text-muted);'"
              title="Favorito">
              <svg class="w-3.5 h-3.5" :class="$store.customEmojis.isFavorite(emoji.id) ? 'fill-current' : 'fill-none'" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
              </svg>
            </button>

            <div class="w-12 h-12 flex items-center justify-center p-1 border"
              style="background: var(--wiki-bg-outer); border-color: var(--wiki-border);">
              <img :src="emoji.url" :alt="':' + emoji.shortcode + ':'"
                class="max-w-full max-h-full object-contain select-none pointer-events-none"
                @error="$event.target.style.display='none'" />
            </div>

            <div class="w-full text-center min-w-0 font-mono text-xs truncate" style="color: var(--wiki-accent);"
              x-text="':' + emoji.shortcode + ':'"></div>

            <div class="w-full flex items-center justify-center gap-1 pt-1.5 border-t"
              style="border-color: var(--wiki-border);" @click.stop>
              <button type="button" @click="$store.customEmojis.copyShortcode(emoji)" class="souls-btn !p-1" title="Copiar código">
                <i data-lucide="copy" class="w-3 h-3"></i>
              </button>
              <button type="button" @click="$store.customEmojis.editEmoji(emoji); creatorOpen = true; activeFormTab = 'single';" class="souls-btn !p-1" title="Editar">
                <i data-lucide="pencil" class="w-3 h-3"></i>
              </button>
              <button type="button" @click="$store.customEmojis.deleteEmoji(emoji.id)" class="souls-btn souls-btn-danger !p-1" title="Eliminar">
                <i data-lucide="trash-2" class="w-3 h-3"></i>
              </button>
            </div>
          </div>
        </template>
      </div>
    </template>
  </section>
</div>
