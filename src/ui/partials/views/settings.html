<!-- VISTA PRINCIPAL: CONFIGURACIÓN ESTILO DISCORD / NOTION (MENÚ LATERAL + 1 COLUMNA) -->
<main id="main-settings-view"
  x-show="$store.app.activeView === 'settings'"
  x-cloak
  @keydown.escape.window="if ($store.app.activeView === 'settings') $store.settings.closeModal()"
  class="settings-fullscreen-view"
  role="region"
  aria-label="Configuración del Sistema">

  <template x-if="$store.app.isViewVisited('settings')">
    <div class="wiki-shell">

      <!-- CABECERA SOBRIA -->
      <header class="wiki-settings-header">
        <div class="wiki-settings-title-group">
          <h1 class="wiki-settings-title">Configuración</h1>
          <kbd class="wiki-settings-kbd">Ctrl + ,</kbd>
        </div>

        <button type="button"
          @click="$store.settings.closeModal()"
          class="souls-btn"
          aria-label="Volver">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span x-text="$store.app.previousView === 'tierlist' ? 'Volver a Tier List' : ($store.app.previousView === 'editor' && $store.characters.active ? 'Volver a la Ficha' : 'Volver al Panel')"></span>
        </button>
      </header>

      <!-- CUERPO: MENÚ LATERAL IZQUIERDO + CONTENIDO EN 1 COLUMNA -->
      <div class="wiki-settings-layout">

        <!-- Menú Lateral Izquierdo -->
        <aside class="wiki-settings-sidebar" aria-label="Menú de configuración">
          <nav class="wiki-settings-nav" role="tablist">
            <div class="wiki-settings-nav-label">Personalización</div>

            <button type="button" role="tab"
              @click="$store.settings.setSubTab('identity')"
              :aria-selected="$store.settings.activeSubTab === 'identity'"
              :class="{ 'is-active': $store.settings.activeSubTab === 'identity' }"
              class="wiki-settings-nav-item">
              <i data-lucide="palette" class="w-4 h-4 shrink-0"></i>
              <span>Apariencia</span>
            </button>

            <button type="button" role="tab"
              @click="$store.settings.setSubTab('presets')"
              :aria-selected="$store.settings.activeSubTab === 'presets'"
              :class="{ 'is-active': $store.settings.activeSubTab === 'presets' }"
              class="wiki-settings-nav-item">
              <i data-lucide="sparkles" class="w-4 h-4 shrink-0"></i>
              <span>Temas y Kits</span>
            </button>

            <button type="button" role="tab"
              @click="$store.settings.setSubTab('environment')"
              :aria-selected="$store.settings.activeSubTab === 'environment'"
              :class="{ 'is-active': $store.settings.activeSubTab === 'environment' }"
              class="wiki-settings-nav-item">
              <i data-lucide="image" class="w-4 h-4 shrink-0"></i>
              <span>Fondos</span>
            </button>

            <div class="wiki-settings-nav-label">Contenido y Datos</div>

            <button type="button" role="tab"
              @click="$store.settings.setSubTab('emojis')"
              :aria-selected="$store.settings.activeSubTab === 'emojis'"
              :class="{ 'is-active': $store.settings.activeSubTab === 'emojis' }"
              class="wiki-settings-nav-item">
              <i data-lucide="smile" class="w-4 h-4 shrink-0"></i>
              <span>Emojis</span>
            </button>

            <button type="button" role="tab"
              @click="$store.settings.setSubTab('data')"
              :aria-selected="$store.settings.activeSubTab === 'data'"
              :class="{ 'is-active': $store.settings.activeSubTab === 'data' }"
              class="wiki-settings-nav-item">
              <i data-lucide="database" class="w-4 h-4 shrink-0"></i>
              <span>Copias de Seguridad</span>
            </button>

            <div class="wiki-settings-nav-label">Aplicación</div>

            <button type="button" role="tab"
              @click="$store.settings.setSubTab('extras')"
              :aria-selected="$store.settings.activeSubTab === 'extras'"
              :class="{ 'is-active': $store.settings.activeSubTab === 'extras' }"
              class="wiki-settings-nav-item">
              <i data-lucide="sliders" class="w-4 h-4 shrink-0"></i>
              <span>Tier List y Sistema</span>
            </button>
          </nav>
        </aside>

        <!-- Área Principal (1 Columna Despejada) -->
        <div class="wiki-settings-content">
          <div x-show="$store.settings.activeSubTab === 'identity'">
            <include src="./src/ui/partials/views/settings/settings-identity.html"></include>
          </div>

          <div x-show="$store.settings.activeSubTab === 'presets'">
            <include src="./src/ui/partials/views/settings/settings-presets.html"></include>
          </div>

          <div x-show="$store.settings.activeSubTab === 'environment'">
            <include src="./src/ui/partials/views/settings/settings-environment.html"></include>
          </div>

          <div x-show="$store.settings.activeSubTab === 'emojis'">
            <include src="./src/ui/partials/views/settings/settings-emojis.html"></include>
          </div>

          <div x-show="$store.settings.activeSubTab === 'data'">
            <include src="./src/ui/partials/views/settings/settings-data.html"></include>
          </div>

          <div x-show="$store.settings.activeSubTab === 'extras'">
            <include src="./src/ui/partials/views/settings/settings-extras.html"></include>
          </div>

          <!-- Pie de acciones alineado al contenido -->
          <footer class="wiki-settings-footer">
            <button type="button"
              @click="$store.settings.resetToDefault()"
              class="souls-btn souls-btn-danger"
              title="Restaura colores, fuentes y fondos predeterminados">
              <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
              <span>Restaurar valores iniciales</span>
            </button>

            <div class="flex flex-wrap items-center gap-2 ml-auto">
              <button type="button"
                @click="$store.settings.saveAsGlobalDefault()"
                class="souls-btn"
                title="Guarda tu apariencia actual como tema por defecto">
                <i data-lucide="save" class="w-3.5 h-3.5"></i>
                <span>Guardar como predeterminado</span>
              </button>

              <button type="button"
                @click="$store.settings.applyAndCloseModal()"
                class="souls-btn souls-btn-primary">
                <i data-lucide="check" class="w-3.5 h-3.5"></i>
                <span>Aplicar y Salir</span>
              </button>
            </div>
          </footer>
        </div>

      </div>
    </div>
  </template>
</main>
