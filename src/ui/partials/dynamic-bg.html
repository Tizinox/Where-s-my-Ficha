<!-- ==============================================================
     DYNAMIC BACKGROUND LAYER (WIKI SOBRIO & EDITORIAL)
     ============================================================== -->
<div id="dynamic-bg-container" class="fixed inset-0 pointer-events-none -z-10 overflow-hidden w-full h-full"
  style="background-color: var(--wiki-bg-outer);">
  <!-- Capa de compatibilidad de ID para controladores existentes -->
  <div id="dynamic-bg-layer" class="absolute inset-0 pointer-events-none">
    <!-- Base sólida exterior -->
    <div class="absolute inset-0 pointer-events-none" style="background-color: var(--wiki-bg-outer);"></div>

    <!-- Imagen personalizada (si existe wallpaper activo), con opacidad sobria y elegante -->
    <template
      x-if="($store.characters.active?.presentation?.background?.image || $store.characters.active?.visualSettings?.backgroundUrl) && ($store.characters.active?.presentation?.background?.mode === 'custom' || $store.characters.active?.presentation?.background?.mode === 'sync')">
      <div id="custom-bg-layer" class="absolute inset-0 overflow-hidden opacity-10 transition-opacity duration-300">
        <img
          :src="$store.app.getOptimizedImageUrl($store.characters.active?.presentation?.background?.image || $store.characters.active?.visualSettings?.backgroundUrl)"
          class="w-full h-full object-cover pointer-events-none"
          :style="$store.characters.getBackgroundStyle()"
          alt="" />
      </div>
    </template>
  </div>
</div>
