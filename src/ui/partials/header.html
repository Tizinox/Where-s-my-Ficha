<!-- ==============================================================
     HEADER BAR — WIKI FANDOM FLAT TOP BAR
     ============================================================== -->
<header id="app-header" class="sticky top-0 z-40 w-full border-b"
  style="background-color: var(--wiki-bg-header); border-color: var(--wiki-border);"
  :class="{ '!hidden': $store.app.activeView === 'tierlist' && $store.tierlist.isZenMode }">
  <div class="w-full max-w-[1240px] mx-auto px-4 h-14 flex items-center justify-between gap-4">

    <!-- Izquierda: Identidad de la Wiki y Navegación Principal -->
    <div class="flex items-center gap-4 lg:gap-6 min-w-0">
      <a href="#" id="brand-logo" @click.prevent="$store.app.openDashboardView()"
        class="flex items-center gap-2.5 text-decoration-none group shrink-0"
        title="Where's my Ficha — Archivo Central">
        <img src="/favicon.png" alt="Logo" class="w-7 h-7 object-contain border p-0.5 shrink-0"
          style="border-color: var(--wiki-border-strong);" />
        <div class="flex flex-col">
          <span style="font-family: var(--font-display); letter-spacing: 0.06em;"
            class="text-xs sm:text-sm font-bold text-[#e4e4e9] group-hover:text-[#c8aa6e] transition-colors leading-tight truncate">
            WHERE'S MY FICHA
          </span>
          <span class="text-[9px] sm:text-[10px] uppercase tracking-widest hidden sm:inline" style="color: var(--wiki-text-muted);">
            Compendio &amp; Wiki de Personajes
          </span>
        </div>
      </a>

      <!-- Navegación Principal estilo Wiki (Pestañas Superiores) -->
      <nav id="main-nav-tabs" class="hidden md:flex items-center gap-1 shrink-0">
        <button type="button" data-tab="characters"
          class="souls-btn !border-0 !bg-transparent text-xs py-1.5 px-3 uppercase tracking-wider transition-colors cursor-pointer"
          :class="$store.app.activeView === 'dashboard' ? '!text-[var(--wiki-accent)] !border-b-2 !border-[var(--wiki-accent)] font-semibold' : 'text-slate-300 hover:text-white'"
          @click="$store.app.openDashboardView()">
          Archivo de Fichas
        </button>
        <button type="button" data-tab="tierlist"
          class="souls-btn !border-0 !bg-transparent text-xs py-1.5 px-3 uppercase tracking-wider transition-colors cursor-pointer"
          :class="$store.app.activeView === 'tierlist' ? '!text-[var(--wiki-accent)] !border-b-2 !border-[var(--wiki-accent)] font-semibold' : 'text-slate-300 hover:text-white'"
          @click="$store.app.openTierListView()">
          Tier List
        </button>
        <button type="button" data-tab="settings"
          class="souls-btn !border-0 !bg-transparent text-xs py-1.5 px-3 uppercase tracking-wider transition-colors cursor-pointer"
          :class="$store.app.activeView === 'settings' ? '!text-[var(--wiki-accent)] !border-b-2 !border-[var(--wiki-accent)] font-semibold' : 'text-slate-300 hover:text-white'"
          @click="$store.settings.openModal()">
          Configuración
        </button>
      </nav>

      <!-- Contexto del Personaje Activo cuando se está en el Editor -->
      <div x-show="$store.app.activeView === 'editor'" class="flex items-center gap-2 min-w-0 shrink">
        <button id="btn-back-to-dashboard" type="button"
          class="souls-btn text-[11px] py-1 px-2.5 shrink-0"
          @click="$store.app.openDashboardView()" title="Regresar al Archivo de Fichas">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span class="hidden xl:inline">Fichas</span>
        </button>

        <span class="text-xs font-serif font-semibold text-parchment-cream truncate max-w-[130px] sm:max-w-[170px]"
          x-text="$store.characters.active?.name || 'Ficha sin título'"></span>

        <!-- Favorito & Bloqueo -->
        <div class="flex items-center gap-1 shrink-0">
          <button type="button" @click="$store.characters.toggleFavorite($store.characters.activeId)"
            class="p-1 border transition-colors text-xs flex items-center justify-center shrink-0 cursor-pointer"
            :class="$store.characters.active?.isFavorite ? 'border-amber-400/50 text-amber-300 bg-amber-500/10' : 'border-white/10 text-white/40 hover:text-amber-300'"
            :title="$store.characters.active?.isFavorite ? 'Ficha Favorita ★' : 'Marcar como favorita ★'">
            <i data-lucide="star" class="w-3.5 h-3.5" :class="{ 'fill-amber-400 text-amber-400': $store.characters.active?.isFavorite }"></i>
          </button>
          <button type="button" @click="$store.characters.toggleLocked($store.characters.activeId)"
            class="p-1 border transition-colors text-xs flex items-center justify-center shrink-0 cursor-pointer"
            :class="$store.characters.active?.isLocked ? 'border-amber-400/50 text-amber-300 bg-amber-500/10' : 'border-white/10 text-white/40 hover:text-white'"
            :title="$store.characters.active?.isLocked ? 'Ficha protegida contra edición 🔒' : 'Proteger ficha contra edición 🔓'">
            <i :data-lucide="$store.characters.active?.isLocked ? 'lock' : 'unlock'" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Derecha: Estado, Modos y Acciones Rápidas -->
    <div class="flex items-center gap-2 shrink-0">

      <!-- Switch Modo Edición vs Vista Previa (En Editor) -->
      <div x-show="$store.app.activeView === 'editor'" class="flex items-center border border-white/15" role="group">
        <button id="btn-mode-preview" type="button"
          class="souls-btn text-[11px] py-1 px-2.5 !border-0 cursor-pointer"
          :class="!$store.app.editMode ? 'souls-btn-primary' : 'text-slate-300'"
          @click="$store.app.editMode && $store.app.toggleEditMode()"
          title="Vista Previa estilo Artículo Wiki (Ctrl + P)">
          <i data-lucide="book-open" class="w-3 h-3"></i>
          <span class="hidden sm:inline">Artículo</span>
        </button>
        <button id="btn-mode-edit" type="button"
          class="souls-btn text-[11px] py-1 px-2.5 !border-0 border-l border-white/10 cursor-pointer"
          :class="$store.app.editMode ? 'souls-btn-primary' : 'text-slate-300'"
          @click="$store.characters.active?.isLocked ? $store.app.toast('Ficha protegida contra edición.', 'warning') : ($store.app.editMode || $store.app.toggleEditMode())"
          title="Modo Edición estilo Menú Dark Souls (Ctrl + E)">
          <i data-lucide="edit-3" class="w-3 h-3"></i>
          <span class="hidden sm:inline">Editar</span>
        </button>
      </div>

      <!-- Estado de Auto-Guardado -->
      <div class="flex items-center no-print shrink-0" x-show="$store.characters.active" x-cloak>
        <template x-if="$store.characters.saveStatus === 'saving'">
          <span class="text-[11px] font-mono text-[var(--wiki-accent)] flex items-center gap-1">
            <i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i>
            <span class="hidden lg:inline">Guardando...</span>
          </span>
        </template>
        <template x-if="$store.characters.saveStatus === 'pending'">
          <button type="button" @click="$store.characters.forceSave()"
            class="souls-btn text-[11px] py-1 px-2 !border-amber-500/50 text-amber-300 hover:bg-amber-500/10 cursor-pointer"
            title="Cambios pendientes. Clic o Ctrl+S para guardar">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
            <span class="hidden lg:inline">Guardar</span>
          </button>
        </template>
        <template x-if="$store.characters.saveStatus === 'saved' || $store.characters.saveStatus === 'idle'">
          <span class="text-[11px] font-mono text-emerald-400/90 flex items-center gap-1 select-none">
            <i data-lucide="check" class="w-3 h-3"></i>
            <span class="hidden lg:inline">Guardado</span>
          </span>
        </template>
        <template x-if="$store.characters.saveStatus === 'error'">
          <button type="button" @click="$store.characters.forceSave()"
            class="souls-btn text-[11px] py-1 px-2 !border-rose-500/50 text-rose-400 hover:bg-rose-500/10 cursor-pointer"
            title="Error al guardar. Clic para reintentar">
            <i data-lucide="alert-circle" class="w-3 h-3"></i>
            <span class="hidden lg:inline">Error</span>
          </button>
        </template>
      </div>

      <!-- Botón + Nueva Ficha -->
      <button type="button" id="btn-new-character" class="souls-btn souls-btn-primary text-xs py-1.5 px-3 cursor-pointer flex items-center gap-1.5"
        @click="$store.characters.createNew()" title="Crear nueva ficha de personaje">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        <span>Nueva Ficha</span>
      </button>

      <!-- Utilidades: Consola de comandos & Atajos -->
      <button id="btn-dev-console" type="button" @click="$store.devConsole.toggleModal()"
        class="souls-btn text-xs py-1 px-2 cursor-pointer no-print" title="Consola de Comandos (Ctrl + `)">
        <i data-lucide="terminal" class="w-3.5 h-3.5"></i>
      </button>
      <button type="button" @click="$store.app.toggleHotkeysModal()"
        class="souls-btn text-xs py-1 px-2 cursor-pointer no-print hidden md:inline-flex" title="Guía de Atajos (Shift + ?)">
        <i data-lucide="keyboard" class="w-3.5 h-3.5"></i>
      </button>

    </div>

  </div>
</header>
