<!-- ==============================================================
           MODAL DE ATAJOS DE TECLADO (HOTKEYS GUIDE MODAL)
           ============================================================== -->
  <div id="tactical-hotkeys-modal" class="modal-backdrop z-[999999] p-3 sm:p-6" x-show="$store.app.showHotkeysModal"
    x-cloak x-data x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
    @keydown.escape.window="$store.app.closeHotkeysModal()" role="dialog" aria-modal="true"
    aria-labelledby="hotkeys-modal-title">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-md" @click="$store.app.closeHotkeysModal()"></div>

    <!-- Modal Dialog Window (Render diferido bajo demanda) -->
    <template x-if="$store.app.showHotkeysModal">
    <div
      class="modal-box relative w-full max-w-2xl bg-[#0a0d12] border-2 border-accent-gold/50 rounded-2xl shadow-[0_0_30px_rgba(255,215,0,0.15)] overflow-hidden flex flex-col max-h-[85vh] text-parchment-cream">

      <!-- Modal Header -->
      <div class="px-5 py-4 bg-[#06080a] border-b border-accent-gold/30 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
          <div class="p-2 rounded-xl bg-accent-gold/10 border border-accent-gold/40 text-accent-gold">
            <i data-lucide="keyboard" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 id="hotkeys-modal-title"
              class="font-title text-base text-accent-gold font-bold uppercase tracking-wider flex items-center gap-2">
              Atajos de Teclado
            </h3>
            <p class="text-[11px] text-ink-slate font-sans mt-0.5">Control de precisión y comandos de productividad
              global</p>
          </div>
        </div>

        <button type="button" @click="$store.app.closeHotkeysModal()"
          class="p-1.5 rounded-lg bg-black/50 text-ink-slate hover:text-white hover:bg-white/10 border border-white/10 transition-all cursor-pointer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Modal Content: Shortcuts Grid -->
      <div class="p-5 overflow-y-auto space-y-5 custom-scrollbar text-xs font-sans">

        <!-- Bloque 1: Persistencia y Seguridad -->
        <div class="space-y-2.5">
          <h4 class="font-title text-xs text-accent-cyan font-bold uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="shield-check" class="w-4 h-4"></i> Persistencia y Seguridad de Datos
          </h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div class="p-2.5 rounded-xl bg-black/40 border border-white/10 flex items-center justify-between">
              <span class="text-parchment-cream font-medium">Forzar Guardado Inmediato</span>
              <div class="flex items-center gap-1">
                <kbd class="tactical-kbd">Ctrl</kbd> + <kbd class="tactical-kbd">S</kbd>
              </div>
            </div>
            <div class="p-2.5 rounded-xl bg-black/40 border border-white/10 flex items-center justify-between">
              <span class="text-parchment-cream font-medium">Deshacer Cambio (Undo)</span>
              <div class="flex items-center gap-1">
                <kbd class="tactical-kbd">Ctrl</kbd> + <kbd class="tactical-kbd">Z</kbd>
              </div>
            </div>
            <div
              class="p-2.5 rounded-xl bg-black/40 border border-white/10 flex items-center justify-between sm:col-span-2">
              <span class="text-parchment-cream font-medium">Rehacer Cambio (Redo)</span>
              <div class="flex items-center gap-1">
                <kbd class="tactical-kbd">Ctrl</kbd> + <kbd class="tactical-kbd">Y</kbd> <span
                  class="text-[10px] text-ink-slate">ó</span> <kbd class="tactical-kbd">Ctrl</kbd> + <kbd
                  class="tactical-kbd">Shift</kbd> + <kbd class="tactical-kbd">Z</kbd>
              </div>
            </div>
          </div>
        </div>

        <!-- Bloque 2: Navegación y Búsqueda -->
        <div class="space-y-2.5">
          <h4 class="font-title text-xs text-accent-cyan font-bold uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="compass" class="w-4 h-4"></i> Navegación y Búsqueda Transversal
          </h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div class="p-2.5 rounded-xl bg-black/40 border border-white/10 flex items-center justify-between">
              <span class="text-parchment-cream font-medium">Enfocar Buscador Profundo</span>
              <div class="flex items-center gap-1">
                <kbd class="tactical-kbd">Ctrl</kbd> + <kbd class="tactical-kbd">F</kbd>
              </div>
            </div>
            <div class="p-2.5 rounded-xl bg-black/40 border border-white/10 flex items-center justify-between">
              <span class="text-parchment-cream font-medium">Cerrar Modales / Volver al Panel</span>
              <div class="flex items-center gap-1">
                <kbd class="tactical-kbd">Esc</kbd>
              </div>
            </div>
          </div>
        </div>

        <!-- Bloque 3: Vistas y Sistema -->
        <div class="space-y-2.5">
          <h4 class="font-title text-xs text-accent-cyan font-bold uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="zap" class="w-4 h-4"></i> Vistas y Productividad
          </h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div class="p-2.5 rounded-xl bg-black/40 border border-white/10 flex items-center justify-between sm:col-span-2">
              <span class="text-parchment-cream font-medium">Abrir / Alternar Configuraciones</span>
              <div class="flex items-center gap-1">
                <kbd class="tactical-kbd">Ctrl</kbd> + <kbd class="tactical-kbd">,</kbd>
              </div>
            </div>
            <div class="p-2.5 rounded-xl bg-black/40 border border-white/10 flex items-center justify-between">
              <span class="text-parchment-cream font-medium">Abrir Guía de Atajos</span>
              <div class="flex items-center gap-1">
                <kbd class="tactical-kbd">Shift</kbd> + <kbd class="tactical-kbd">?</kbd>
              </div>
            </div>
            <div class="p-2.5 rounded-xl bg-black/40 border border-white/10 flex items-center justify-between">
              <span class="text-parchment-cream font-medium">Abrir Consola Dev HUD</span>
              <div class="flex items-center gap-1">
                <kbd class="tactical-kbd">Ctrl</kbd> + <kbd class="tactical-kbd">`</kbd>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Modal Footer -->
      <div
        class="px-5 py-3.5 bg-[#06080a] border-t border-accent-gold/20 flex items-center justify-between shrink-0 text-xs font-mono">
        <span class="text-ink-slate">Presiona <kbd class="tactical-kbd">Esc</kbd> para cerrar</span>
        <button type="button" @click="$store.app.closeHotkeysModal()"
          class="px-4 py-2 rounded-xl bg-accent-gold text-black hover:bg-amber-300 font-bold uppercase tracking-wider transition-all cursor-pointer shadow-md">
          Entendido
        </button>
      </div>

    </div>
    </template>
  </div>
