<!-- ==============================================================
     CONSOLA DE COMANDOS — Terminal Flotante, Herramientas de Ficha y Diagnóstico
     ============================================================== -->
<div id="dev-console-modal" class="fixed z-[999999] pointer-events-none transition-all duration-200" x-data
  :class="$store.devConsole.posX === null ? ($store.devConsole.windowSize === 'expanded' ? 'bottom-6 right-6 w-[95vw] max-w-[880px]' : 'bottom-6 right-6 w-[92vw] max-w-[660px]') : ($store.devConsole.windowSize === 'expanded' ? 'w-[95vw] max-w-[880px]' : 'w-[92vw] max-w-[660px]')"
  :style="$store.devConsole.posX !== null && $store.devConsole.posY !== null ? `left: ${$store.devConsole.posX}px; top: ${$store.devConsole.posY}px; right: auto; bottom: auto; position: fixed;` : ''"
  x-show="$store.devConsole.showModal" x-cloak x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
  x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 scale-100"
  x-transition:leave-end="opacity-0 scale-95" role="region" aria-label="Consola de Comandos">

  <!-- Ventana flotante (Render diferido bajo demanda) -->
  <template x-if="$store.devConsole.showModal">
    <div
      class="pointer-events-auto relative bg-[#06080d]/95 border-2 border-emerald-500/40 rounded-2xl shadow-[0_25px_70px_rgba(0,0,0,0.9),0_0_35px_rgba(16,185,129,0.18)] overflow-hidden flex flex-col text-slate-200 font-mono text-xs backdrop-blur-2xl transition-all duration-200">

      <!-- ──── 1. BARRA SUPERIOR (Arrastrable / Drag Handle) ──── -->
      <div @mousedown="$store.devConsole.startDrag($event)"
        class="px-3.5 py-2.5 bg-[#040508] border-b border-emerald-500/25 flex flex-wrap items-center justify-between gap-2 shrink-0 select-none cursor-grab active:cursor-grabbing"
        title="Mantén presionado y arrastra para mover la consola a cualquier parte de la pantalla">

        <!-- Lado Izquierdo: Icono, Título y Selector de Pestañas -->
        <div class="flex items-center gap-2.5">
          <div class="p-1 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 shrink-0 shadow-sm flex items-center justify-center">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
          </div>
          <div>
            <h3 id="dev-console-title"
              class="font-title text-xs sm:text-sm text-emerald-400 font-bold uppercase tracking-wider flex items-center gap-2">
              <span>CONSOLA</span>

              <!-- Toggle LED En Vivo / Pausado -->
              <button type="button" @click.stop="$store.devConsole.togglePauseLive()"
                :title="$store.devConsole.isLivePaused ? 'Transmisión congelada. Clic para reanudar' : 'Transmisión en vivo. Clic para congelar pantalla y leer registros'"
                class="text-[9px] px-1.5 py-0.5 rounded font-mono font-bold flex items-center gap-1 cursor-pointer transition-all border"
                :class="$store.devConsole.isLivePaused ? 'bg-amber-500/20 text-amber-300 border-amber-500/40 animate-pulse' : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'">
                <span class="w-1.5 h-1.5 rounded-full inline-block"
                  :class="$store.devConsole.isLivePaused ? 'bg-amber-400' : 'bg-emerald-400 animate-ping'"></span>
                <span x-text="$store.devConsole.isLivePaused ? 'PAUSADO' : 'EN VIVO'"></span>
              </button>
            </h3>
          </div>

          <!-- Selector de Modo / Pestañas de la Consola -->
          <div class="hidden sm:flex items-center bg-black/60 border border-white/10 rounded-lg p-0.5 text-[10px] ml-1">
            <button type="button" @click="$store.devConsole.activeTab = 'terminal'"
              :class="$store.devConsole.activeTab === 'terminal' ? 'bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/40 shadow-sm' : 'text-slate-400 hover:text-white'"
              class="px-2 py-0.5 rounded transition-all cursor-pointer flex items-center gap-1">
              <span>Terminal</span>
            </button>
            <button type="button" @click="$store.devConsole.activeTab = 'logs'"
              :class="$store.devConsole.activeTab === 'logs' ? 'bg-cyan-500/20 text-cyan-300 font-bold border border-cyan-500/40 shadow-sm' : 'text-slate-400 hover:text-white'"
              class="px-2 py-0.5 rounded transition-all cursor-pointer flex items-center gap-1">
              <span>Eventos y Logs</span>
            </button>
            <button type="button" @click="$store.devConsole.activeTab = 'all'"
              :class="$store.devConsole.activeTab === 'all' ? 'bg-purple-500/20 text-purple-300 font-bold border border-purple-500/40 shadow-sm' : 'text-slate-400 hover:text-white'"
              class="px-2 py-0.5 rounded transition-all cursor-pointer">
              Todos
            </button>
          </div>
        </div>

        <!-- Lado Derecho: Controles de Ventana (con SVGs directos y nítidos) -->
        <div class="flex items-center gap-1.5">
          <!-- Limpiar Pantalla -->
          <button type="button" @click="$store.devConsole.clearLogs()" title="Limpiar historial de la consola"
            class="px-2 py-1 rounded-lg bg-white/5 border border-white/10 text-slate-300 hover:text-rose-300 hover:bg-rose-500/20 hover:border-rose-500/40 transition-all text-[10px] font-bold flex items-center gap-1 cursor-pointer">
            <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
            <span class="hidden md:inline">LIMPIAR</span>
          </button>

          <!-- Alternar Ancho (Normal / Expandido) -->
          <button type="button" @click="$store.devConsole.toggleWindowSize()"
            :title="$store.devConsole.windowSize === 'expanded' ? 'Reducir ancho de ventana' : 'Expandir ancho de ventana'"
            class="p-1.5 rounded-lg bg-black/60 text-slate-300 hover:text-emerald-300 hover:bg-emerald-500/20 border border-white/10 hover:border-emerald-500/40 transition-all cursor-pointer flex items-center justify-center">
            <!-- Icono cuando está normal: expandir flechas hacia afuera -->
            <svg x-show="$store.devConsole.windowSize !== 'expanded'" class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
            <!-- Icono cuando está expandido: contraer flechas hacia adentro -->
            <svg x-show="$store.devConsole.windowSize === 'expanded'" class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 14 10 14 10 20"></polyline>
              <polyline points="20 10 14 10 14 4"></polyline>
              <line x1="14" y1="10" x2="21" y2="3"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          </button>

          <!-- Minimizar / Desplegar Contenido -->
          <button type="button" @click="$store.devConsole.toggleMinimize()"
            :title="$store.devConsole.isMinimized ? 'Expandir consola' : 'Minimizar consola'"
            class="p-1.5 rounded-lg bg-black/60 text-slate-300 hover:text-cyan-300 hover:bg-cyan-500/20 border border-white/10 hover:border-cyan-500/40 transition-all cursor-pointer flex items-center justify-center">
            <!-- Icono de minimizar: flechas hacia abajo -->
            <svg x-show="!$store.devConsole.isMinimized" class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="7 13 12 18 17 13"></polyline>
              <polyline points="7 6 12 11 17 6"></polyline>
            </svg>
            <!-- Icono de restaurar: flechas hacia arriba -->
            <svg x-show="$store.devConsole.isMinimized" class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 11 12 6 7 11"></polyline>
              <polyline points="17 18 12 13 7 18"></polyline>
            </svg>
          </button>

          <!-- Cerrar (X) -->
          <button type="button" @click="$store.devConsole.closeModal()" title="Cerrar consola (Ctrl + `)"
            class="p-1.5 rounded-lg bg-black/60 text-slate-300 hover:text-rose-300 hover:bg-rose-500/20 border border-white/10 hover:border-rose-500/40 transition-all cursor-pointer flex items-center justify-center">
            <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- ──── 2. BARRA DE HERRAMIENTAS RÁPIDAS (Toolbox de 1 Clic sin dados) ──── -->
      <div x-show="!$store.devConsole.isMinimized"
        class="px-3 py-1.5 bg-[#030407] border-b border-emerald-500/20 flex items-center gap-1.5 overflow-x-auto text-[10px] shrink-0 custom-scrollbar select-none">
        <span class="text-slate-400 text-[9px] uppercase font-bold shrink-0 flex items-center gap-1">
          <svg class="w-3 h-3 text-amber-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Acciones Rápidas:</span>
        </span>
        <template x-for="action in $store.devConsole.quickActions" :key="action.cmd">
          <button type="button" @click="$store.devConsole.runQuickAction(action.cmd)"
            class="px-2 py-0.5 rounded-md bg-white/5 hover:bg-emerald-500/20 hover:border-emerald-500/40 border border-white/10 text-slate-200 hover:text-emerald-300 font-mono font-bold flex items-center gap-1 cursor-pointer shrink-0 transition-all active:scale-95 shadow-sm"
            :title="action.title">
            <span x-text="action.label"></span>
          </button>
        </template>
      </div>

      <!-- ──── 3. BARRA DE CONTROL PARA EVENTOS y LOGS (Solo visible en modo logs o all) ──── -->
      <div x-show="!$store.devConsole.isMinimized && $store.devConsole.activeTab !== 'terminal'"
        class="px-3 py-1.5 bg-[#05070a] border-b border-white/5 flex flex-wrap items-center justify-between gap-2">
        <!-- Filtros por Severidad -->
        <div class="flex items-center bg-black/60 border border-white/10 rounded-lg p-0.5 text-[10px]">
          <button type="button" @click="$store.devConsole.filter = 'ALL'"
            :class="$store.devConsole.filter === 'ALL' ? 'bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/40' : 'text-slate-400 hover:text-white'"
            class="px-1.5 py-0.5 rounded transition-all cursor-pointer">
            TODOS
          </button>
          <button type="button" @click="$store.devConsole.filter = 'INFO'"
            :class="$store.devConsole.filter === 'INFO' ? 'bg-cyan-500/20 text-cyan-300 font-bold border border-cyan-500/40' : 'text-slate-400 hover:text-white'"
            class="px-1.5 py-0.5 rounded transition-all cursor-pointer">
            INFO
          </button>
          <button type="button" @click="$store.devConsole.filter = 'WARN'"
            :class="$store.devConsole.filter === 'WARN' ? 'bg-amber-500/20 text-amber-300 font-bold border border-amber-500/40' : 'text-slate-400 hover:text-white'"
            class="px-1.5 py-0.5 rounded transition-all cursor-pointer">
            AVISO
          </button>
          <button type="button" @click="$store.devConsole.filter = 'ERROR'"
            :class="$store.devConsole.filter === 'ERROR' ? 'bg-rose-500/20 text-rose-300 font-bold border border-rose-500/40' : 'text-slate-400 hover:text-white'"
            class="px-1.5 py-0.5 rounded transition-all cursor-pointer">
            ERROR
          </button>
        </div>

        <!-- Búsqueda con resaltado -->
        <div class="relative flex-1 min-w-[140px] max-w-[280px]">
          <svg class="w-3 h-3 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" x-model="$store.devConsole.searchQuery"
            placeholder="Buscar eventos o registros..."
            class="w-full pl-7 pr-6 py-0.5 bg-black/60 border border-white/10 rounded-lg text-[10px] font-mono text-slate-200 placeholder:text-slate-500 focus:border-cyan-500/60 focus:bg-black/80 outline-none transition-all" />
          <button type="button" x-show="$store.devConsole.searchQuery" @click="$store.devConsole.searchQuery = ''"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors cursor-pointer">
            <svg class="w-2.5 h-2.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <!-- Acciones de Exportación de Logs -->
        <div class="flex items-center gap-1">
          <button type="button" @click="$store.devConsole.copyLogs()" title="Copiar logs completos al portapapeles"
            class="px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500 hover:text-black transition-all text-[9px] font-bold flex items-center gap-1 cursor-pointer">
            <svg class="w-2.5 h-2.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            <span>COPIAR</span>
          </button>
          <button type="button" @click="$store.devConsole.downloadLogs('log')" title="Descargar como .log"
            class="px-2 py-0.5 rounded bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 hover:bg-cyan-500 hover:text-black transition-all text-[9px] font-bold flex items-center gap-1 cursor-pointer">
            <svg class="w-2.5 h-2.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>.LOG</span>
          </button>
          <button type="button" @click="$store.devConsole.downloadLogs('json')" title="Descargar como .json"
            class="px-2 py-0.5 rounded bg-purple-500/10 border border-purple-500/30 text-purple-300 hover:bg-purple-500 hover:text-white transition-all text-[9px] font-bold flex items-center gap-1 cursor-pointer">
            <span>.JSON</span>
          </button>
        </div>
      </div>

      <!-- Barra de Aviso si está en Pausa -->
      <div x-show="$store.devConsole.isLivePaused && $store.devConsole.pendingCountWhilePaused > 0"
        @click="$store.devConsole.togglePauseLive()"
        class="px-3 py-1 bg-amber-500/20 border-b border-amber-500/40 text-amber-300 text-[10px] font-mono flex items-center justify-between cursor-pointer hover:bg-amber-500/30 transition-colors select-none">
        <span class="flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 animate-pulse text-amber-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="10" y1="15" x2="10" y2="9"/><line x1="14" y1="15" x2="14" y2="9"/></svg>
          <span>Transmisión en pausa (<strong x-text="$store.devConsole.pendingCountWhilePaused"></strong> eventos retenidos)</span>
        </span>
        <span class="underline font-bold text-amber-200">REANUDAR ↵</span>
      </div>

      <!-- ──── 4. CONTENEDOR PRINCIPAL DE REGISTROS Y SALIDAS (Oculto al minimizar) ──── -->
      <div x-show="!$store.devConsole.isMinimized" x-collapse>
        <div id="dev-console-logs-container"
          class="p-3.5 overflow-y-auto space-y-2 min-h-[240px] max-h-[46vh] bg-[#040609] text-[11px] font-mono leading-relaxed select-text custom-scrollbar">

          <!-- Estado inicial si la terminal está limpia -->
          <template x-if="$store.devConsole.activeTab === 'terminal' && $store.devConsole.filteredLogs.length === 0">
            <div class="py-8 px-4 text-center space-y-3">
              <div class="inline-flex p-2.5 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400">
                <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="4 17 10 11 4 5"></polyline>
                  <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
              </div>
              <div class="space-y-1">
                <p class="text-sm font-bold text-emerald-300 font-title">CONSOLA LISTA</p>
                <p class="text-[11px] text-slate-400 max-w-md mx-auto">
                  Escribe un comando abajo o pulsa una acción rápida arriba.
                </p>
              </div>
              <div class="flex flex-wrap justify-center gap-1.5 pt-1 text-[10px]">
                <span class="px-2 py-0.5 rounded bg-black/60 border border-white/10 text-cyan-300 font-mono">char</span>
                <span class="px-2 py-0.5 rounded bg-black/60 border border-white/10 text-emerald-300 font-mono">backup</span>
                <span class="px-2 py-0.5 rounded bg-black/60 border border-white/10 text-amber-300 font-mono">lock</span>
                <span class="px-2 py-0.5 rounded bg-black/60 border border-white/10 text-purple-300 font-mono">help</span>
              </div>
            </div>
          </template>

          <!-- Bucle de Renderizado de Entradas -->
          <template x-for="log in $store.devConsole.filteredLogs" :key="log.id">
            <div>
              <!-- ── Separador de Sesión ── -->
              <template x-if="log.isSessionDivider">
                <div
                  class="py-1 px-3 rounded-lg bg-emerald-950/40 border border-dashed border-emerald-500/30 text-emerald-400 font-mono text-[10px] text-center my-2 select-none font-bold tracking-wider"
                  x-text="log.message"></div>
              </template>

              <!-- ── Easter Egg Especial Desbloqueado ── -->
              <template x-if="log.level === 'EASTER_EGG'">
                <div
                  class="p-3 rounded-xl border bg-black/85 my-1.5 space-y-1.5 shadow-lg transition-all animate-fadeIn"
                  :style="'border-color: ' + $store.settings.accentColor + '; box-shadow: 0 0 18px ' + ($store.settings.activeGlowColor) + '50;'">
                  <div class="flex items-center justify-between">
                    <span
                      class="text-[9px] font-mono font-bold uppercase tracking-wider px-2 py-0.5 rounded border flex items-center gap-1.5"
                      :style="'color: ' + $store.settings.accentColor + '; border-color: ' + $store.settings.accentColor + '; background: rgba(' + $store.settings.rgbChannels + ', 0.15);'">
                      <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
                      <span>[ EASTER EGG UNLOCKED ]</span>
                    </span>
                    <span class="text-[10px] text-slate-500 font-mono" x-text="`[${log.time}]`"></span>
                  </div>
                  <p class="text-xs font-bold font-mono tracking-wide pl-1 text-base"
                    :style="'color: ' + $store.settings.accentColor + '; text-shadow: 0 0 10px ' + ($store.settings.activeGlowColor) + '80;'"
                    x-text="log.message"></p>
                </div>
              </template>

              <!-- ── Prompt Ingresado por el Usuario ── -->
              <template x-if="log.level === 'PROMPT'">
                <div
                  class="flex items-center gap-2 py-1 px-2.5 rounded-lg bg-emerald-500/10 border border-emerald-500/20 my-1 font-mono text-xs text-emerald-300 font-bold">
                  <span class="text-emerald-400 select-none flex items-center gap-1">
                    <svg class="w-3 h-3 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                    <span>ficha:~$</span>
                  </span>
                  <span class="text-slate-100" x-text="log.message.replace(/^>\s*/, '')"></span>
                  <span class="text-[9px] text-slate-500 ml-auto font-normal" x-text="`[${log.time}]`"></span>
                </div>
              </template>

              <!-- ── Salida de Comando de Texto (CMD_OUTPUT / CMD_SUCCESS) ── -->
              <template x-if="log.level === 'CMD_OUTPUT' || log.level === 'CMD_SUCCESS'">
                <div
                  class="p-2.5 rounded-lg bg-black/70 border border-white/10 my-1 font-mono text-[11px] text-slate-200 whitespace-pre-wrap leading-relaxed select-text shadow-sm border-l-2 border-l-cyan-500">
                  <span x-text="log.message"></span>
                </div>
              </template>

              <!-- ── Entrada Estándar de Log del Sistema (INFO, WARN, ERROR) ── -->
              <template
                x-if="!log.isSessionDivider && log.level !== 'EASTER_EGG' && log.level !== 'PROMPT' && log.level !== 'CMD_OUTPUT' && log.level !== 'CMD_SUCCESS'">
                <div
                  class="border-b border-white/5 font-mono group hover:bg-white/[0.03] px-2 py-1 rounded-lg transition-colors cursor-pointer select-text"
                  @click="$store.devConsole.toggleLogExpansion(log)"
                  :title="'Clic para ' + (log.isExpanded ? 'ocultar' : 'ver') + ' detalles técnicos y stack trace'">

                  <div class="flex items-start justify-between gap-2 w-full">
                    <div class="flex items-start gap-1.5 min-w-0 flex-1">
                      <!-- Indicador Chevron -->
                      <svg class="w-3 h-3 text-slate-500 shrink-0 transition-transform duration-150 mt-0.5"
                        :class="{ 'rotate-90 text-emerald-400': log.isExpanded }"
                        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                      </svg>

                      <span class="text-slate-500 text-[10px] shrink-0 font-mono" x-text="`[${log.time}]`"></span>

                      <!-- Severity Badge -->
                      <span
                        class="px-1.5 py-0.2 rounded text-[9px] font-bold uppercase shrink-0 tracking-wider font-mono"
                        :class="{
                          'bg-cyan-950/80 text-cyan-300 border border-cyan-800/40': log.level === 'INFO',
                          'bg-amber-950/80 text-amber-300 border border-amber-800/40': log.level === 'WARN',
                          'bg-rose-950/80 text-rose-300 border border-rose-800/40': log.level === 'ERROR'
                        }" x-text="`[${log.level === 'WARN' ? 'AVISO' : log.level}]`">
                      </span>

                      <!-- Badge de Contador de Logs Repetidos -->
                      <template x-if="log.count > 1">
                        <span
                          class="px-1.5 py-0.2 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[9px] font-mono font-bold shrink-0 shadow-sm"
                          x-text="'(x' + log.count + ')'"
                          :title="'Este evento se disparó ' + log.count + ' veces'"></span>
                      </template>

                      <!-- Mensaje de Log con Resaltado en Vivo -->
                      <span class="break-words font-mono text-[11px] min-w-0 flex-1 leading-snug" :class="{
                          'text-cyan-100/90': log.level === 'INFO',
                          'text-amber-200': log.level === 'WARN',
                          'text-rose-200 font-semibold': log.level === 'ERROR'
                        }" x-html="$store.devConsole.getHighlightedMessage(log)">
                      </span>
                    </div>

                    <!-- Botón de Reportar Error en Discord -->
                    <div class="flex items-center gap-1 shrink-0">
                      <template x-if="log.level === 'ERROR'">
                        <button type="button" @click.stop="$store.devConsole.reportError(log)"
                          class="px-2 py-0.5 rounded-md bg-rose-500/20 hover:bg-rose-500 hover:text-white border border-rose-500/50 text-rose-300 text-[9px] font-mono font-bold uppercase transition-all shrink-0 flex items-center gap-1 cursor-pointer shadow-sm"
                          title="Copia automáticamente un reporte formateado listo para enviar a Discord">
                          <svg class="w-2.5 h-2.5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/><line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/><line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/><line x1="4.93" y1="19.07" x2="9.17" y2="14.83"/></svg>
                          <span class="shrink-0">Reportar</span>
                        </button>
                      </template>
                    </div>
                  </div>

                  <!-- Acordeón de Detalles Técnicos / Stack Trace Completo -->
                  <div x-show="log.isExpanded" x-collapse @click.stop class="mt-2 pl-4 pr-1 space-y-1.5">
                    <div
                      class="p-2.5 rounded-lg bg-black/90 border border-emerald-500/30 text-[10px] space-y-1.5 shadow-inner">
                      <div class="flex items-center justify-between text-slate-400 border-b border-white/10 pb-1">
                        <span class="font-bold text-emerald-400 flex items-center gap-1.5">
                          <svg class="w-3 h-3 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                          <span>Detalle Técnico / Stack Trace:</span>
                        </span>
                        <button type="button" @click.stop="$store.devConsole.copySingleLog(log)"
                          class="text-[9px] text-slate-300 hover:text-white hover:underline flex items-center gap-1 cursor-pointer">
                          <svg class="w-2.5 h-2.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                          <span>Copiar detalle</span>
                        </button>
                      </div>
                      <pre
                        class="whitespace-pre-wrap break-words text-slate-300 font-mono text-[10px] max-h-44 overflow-y-auto select-text custom-scrollbar leading-relaxed bg-black/40 p-1.5 rounded border border-white/5"
                        x-html="$store.devConsole.getHighlightedDetails(log)"></pre>
                    </div>
                  </div>

                </div>
              </template>
            </div>
          </template>

          <template x-if="$store.devConsole.filteredLogs.length === 0 && $store.devConsole.activeTab !== 'terminal'">
            <div class="text-center py-8 text-slate-500 italic font-mono">
              No hay registros disponibles para el filtro o búsqueda seleccionada.
            </div>
          </template>
        </div>

        <!-- ──── 5. SUGERENCIAS DE AUTOCOMPLETADO CLI (Typeahead / TAB) ──── -->
        <div x-show="$store.devConsole.commandSuggestions.length > 0" x-transition
          class="px-3 py-1.5 bg-[#030508] border-t border-emerald-500/20 flex items-center gap-1.5 overflow-x-auto text-[10px] shrink-0 custom-scrollbar select-none">
          <span class="text-slate-500 text-[9px] uppercase font-bold shrink-0 flex items-center gap-1">
            <svg class="w-2.5 h-2.5 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
            <span>Sugerencias [TAB]:</span>
          </span>
          <template x-for="sug in $store.devConsole.commandSuggestions" :key="sug.cmd">
            <button type="button" @click="$store.devConsole.applySuggestion(sug)"
              class="px-2 py-0.5 rounded bg-emerald-500/10 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-300 font-mono font-bold flex items-center gap-1 cursor-pointer shrink-0 transition-all"
              :title="sug.desc">
              <span x-text="sug.cmd"></span>
              <span class="text-slate-500 font-normal text-[8px]" x-show="sug.params" x-text="sug.params"></span>
            </button>
          </template>
        </div>

        <!-- ──── 6. PROMPT DE ENTRADA INTERACTIVO CLI ──── -->
        <div class="px-3.5 py-2.5 bg-[#020305] border-t border-emerald-500/30 flex items-center gap-2 shrink-0">
          <span class="text-emerald-400 font-mono font-bold select-none text-xs flex items-center gap-1 shrink-0">
            <svg class="w-3.5 h-3.5 animate-pulse text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            <span class="text-emerald-300">ficha:~$</span>
          </span>
          <input type="text" id="dev-cli-input" x-model="$store.devConsole.commandInput"
            @keydown.tab="$store.devConsole.handleTabAutocomplete($event)"
            @keydown.enter.prevent="$store.devConsole.executeCommand($store.devConsole.commandInput)"
            @keydown.arrow-up.prevent="$store.devConsole.navigateHistory('up')"
            @keydown.arrow-down.prevent="$store.devConsole.navigateHistory('down')"
            placeholder="Escribe un comando (ej: char, backup, lock, help)..."
            class="flex-1 bg-transparent text-emerald-300 font-mono text-xs outline-none placeholder:text-slate-600 border-none focus:ring-0 p-0" />
          <button type="button" @click="$store.devConsole.executeCommand($store.devConsole.commandInput)"
            class="px-3 py-1 rounded-lg bg-emerald-500/20 hover:bg-emerald-500 hover:text-black border border-emerald-500/40 text-emerald-300 text-[10px] font-mono font-bold transition-all cursor-pointer select-none shrink-0 shadow-sm active:scale-95">
            EJECUTAR ↵
          </button>
        </div>

        <!-- ──── 7. FOOTER CON CONTADORES Y AUTO-SCROLL ──── -->
        <div
          class="px-3 py-1.5 bg-[#040508] border-t border-emerald-500/20 flex flex-wrap items-center justify-between gap-2 text-[10px] text-slate-500 font-mono shrink-0 select-none">
          <div class="flex items-center gap-2">
            <span>Historial: <strong class="text-slate-200" x-text="$store.devConsole.logs.length"></strong>/120</span>
            <span class="text-[9px] text-slate-600 hidden sm:inline">· [TAB] autocompletar · [↑][↓] navegar</span>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" @click="$store.devConsole.resetPosition()" x-show="$store.devConsole.posX !== null"
              class="text-[9px] text-emerald-400/80 hover:text-emerald-300 underline cursor-pointer">
              Restablecer Posición
            </button>
            <button type="button" @click="$store.devConsole.autoScroll = !$store.devConsole.autoScroll"
              :class="$store.devConsole.autoScroll ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-400' : 'bg-white/5 border-white/10 text-slate-500 hover:text-white'"
              class="px-2 py-0.5 rounded border text-[9px] font-mono transition-all flex items-center gap-1 cursor-pointer"
              :title="$store.devConsole.autoScroll ? 'Clic para pausar el desplazamiento automático' : 'Clic para reanudar el desplazamiento automático'">
              <span>Auto-Scroll:</span>
              <strong x-text="$store.devConsole.autoScroll ? 'ACTIVO' : 'PAUSADO'"></strong>
            </button>
          </div>
        </div>

      </div>

    </div>
  </template>
</div>
