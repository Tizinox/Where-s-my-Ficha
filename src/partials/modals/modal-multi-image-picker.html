<!-- ==============================================================
     MODAL: SELECTOR MULTI-IMAGEN / ÁLBUM EXTERNO [CYBER HUD]
     Permite elegir cuál imagen usar cuando una publicación (ArtStation,
     Pixiv, Behance, Are.na, Pinterest, etc.) contiene múltiples artes
     o diferentes niveles de resolución.
     ============================================================== -->
<div id="modal-multi-image-picker"
  class="fixed inset-0 z-[100020] flex items-center justify-center p-3 sm:p-5 bg-black/85 backdrop-blur-md"
  x-show="$store.app.showMultiImagePicker" x-cloak x-data
  @keydown.escape.window="$store.app.showMultiImagePicker && $store.app.closeMultiImagePicker()"
  role="dialog" aria-modal="true" aria-labelledby="multi-picker-title">

  <!-- Fondo oscuro con clic para cerrar -->
  <div class="absolute inset-0 cursor-pointer" @click="$store.app.closeMultiImagePicker()"></div>

  <!-- Contenedor Principal del Modal -->
  <div
    class="relative w-full max-w-4xl max-h-[90vh] bg-[#090d16] border border-cyan-400/50 rounded-2xl shadow-[0_0_50px_rgba(6,182,212,0.25)] flex flex-col text-slate-100 overflow-hidden select-none animate-scale-in z-10"
    :style="`border-color: ${$store.settings.accentColor || '#00f0ff'}70; box-shadow: 0 0 45px ${$store.settings.accentColor || '#00f0ff'}30, 0 25px 60px rgba(0,0,0,0.95);`"
    @click.stop>

    <!-- Barra de Acento Superior Neón -->
    <div class="h-1.5 w-full shrink-0"
      :style="`background: linear-gradient(90deg, ${$store.settings.accentColor || '#00f0ff'}, ${$store.settings.secondaryColor || '#a855f7'}, ${$store.settings.accentColor || '#00f0ff'});`"></div>

    <!-- Modal Header -->
    <div class="px-5 sm:px-6 py-3.5 border-b border-white/10 flex items-center justify-between gap-4 shrink-0 bg-black/40">
      <div class="flex items-center gap-3 min-w-0">
        <!-- Ícono de Galería Neón -->
        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 border"
          :style="`background-color: ${$store.settings.accentColor || '#00f0ff'}18; border-color: ${$store.settings.accentColor || '#00f0ff'}50; color: ${$store.settings.accentColor || '#00f0ff'}; box-shadow: 0 0 15px ${$store.settings.accentColor || '#00f0ff'}30;`">
          <i data-lucide="images" class="w-5 h-5"></i>
        </div>

        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <h3 id="multi-picker-title" class="font-title text-base sm:text-lg font-bold text-white uppercase tracking-wider leading-tight truncate"
              x-text="$store.app.multiImagePickerData?.title || 'Seleccionar Imagen'"></h3>
            
            <!-- Badge de la Plataforma Detectada -->
            <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full uppercase border shrink-0"
              :class="{
                'bg-blue-500/20 text-blue-300 border-blue-400/40': $store.app.multiImagePickerData?.platform === 'artstation' || $store.app.multiImagePickerData?.platform === 'behance',
                'bg-rose-500/20 text-rose-300 border-rose-400/40': $store.app.multiImagePickerData?.platform === 'pinterest',
                'bg-sky-500/20 text-sky-300 border-sky-400/40': $store.app.multiImagePickerData?.platform === 'pixiv',
                'bg-emerald-500/20 text-emerald-300 border-emerald-400/40': $store.app.multiImagePickerData?.platform === 'arena' || $store.app.multiImagePickerData?.platform === 'deviantart',
                'bg-amber-500/20 text-amber-300 border-amber-400/40': !['artstation','behance','pinterest','pixiv','arena','deviantart'].includes($store.app.multiImagePickerData?.platform)
              }"
              x-text="$store.app.multiImagePickerData?.platformName || 'Galería Externa'"></span>
          </div>

          <p class="text-xs font-mono text-slate-400 truncate mt-0.5">
            <span x-show="$store.app.multiImagePickerData?.author" x-text="`Autor: ${$store.app.multiImagePickerData?.author} · `"></span>
            <span class="text-slate-300" x-text="`${$store.app.multiImagePickerData?.images?.length || 0} imágenes / resoluciones encontradas`"></span>
          </p>
        </div>
      </div>

      <!-- Botón de Cerrar -->
      <button type="button" @click="$store.app.closeMultiImagePicker()"
        class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 transition-colors cursor-pointer shrink-0"
        title="Cancelar selección">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Modal Body: Grilla de Miniaturas e Imágenes Disponibles -->
    <div class="p-4 sm:p-6 overflow-y-auto custom-scrollbar flex-1 space-y-4">
      <div class="p-2.5 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between text-xs font-mono text-slate-300">
        <span class="flex items-center gap-2">
          <i data-lucide="mouse-pointer-click" class="w-4 h-4 text-cyan-400 shrink-0"></i>
          <span>Haz clic en la imagen que deseas utilizar. Se abrirá de inmediato en el <strong>editor de recorte (Cropper)</strong> para encuadrarla libremente.</span>
        </span>
      </div>

      <!-- Grilla de Imágenes -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <template x-for="(img, idx) in $store.app.multiImagePickerData?.images || []" :key="idx">
          <div
            @click="$store.app.selectMultiImage(img)"
            class="group/card relative rounded-2xl bg-black/60 border border-white/15 hover:border-cyan-400 p-2.5 flex flex-col gap-2 transition-all cursor-pointer shadow-lg hover:shadow-[0_0_20px_rgba(6,182,212,0.3)] hover:scale-[1.02] active:scale-[0.98]">
            
            <!-- Contenedor Visual de la Imagen -->
            <div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden bg-slate-950 flex items-center justify-center border border-white/10 group-hover/card:border-cyan-400/60 transition-colors">
              <img :src="img.url" loading="lazy"
                class="w-full h-full object-cover transition-transform duration-300 group-hover/card:scale-105 pointer-events-none"
                :alt="img.label || 'Imagen'"
                @error="$el.classList.add('opacity-40');" />
              
              <!-- Badge de Calidad / Resolución Superior -->
              <div class="absolute top-2 left-2 z-10">
                <span class="text-[9.5px] font-mono font-bold px-2 py-0.5 rounded-md shadow-md uppercase tracking-wider backdrop-blur-md"
                  :class="img.isOriginal ? 'bg-amber-500/90 text-black font-black' : 'bg-black/80 text-white border border-white/20'"
                  x-text="img.isOriginal ? '★ ' + (img.label || 'Original') : (img.label || `Opción #${idx + 1}`)"></span>
              </div>

              <!-- Overlay Hover con Botón de Encuadre -->
              <div class="absolute inset-0 bg-black/50 backdrop-blur-[2px] opacity-0 group-hover/card:opacity-100 flex items-center justify-center transition-opacity p-3">
                <span class="px-3 py-1.5 rounded-xl font-mono text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 shadow-xl text-black"
                  :style="`background-color: ${$store.settings.accentColor || '#00f0ff'}; box-shadow: 0 0 15px ${$store.settings.accentColor || '#00f0ff'}80;`">
                  <i data-lucide="crop" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                  <span>Usar y Encuadrar</span>
                </span>
              </div>
            </div>

            <!-- Etiqueta Descriptiva Inferior -->
            <div class="flex items-center justify-between gap-2 px-1 text-[11px] font-mono">
              <span class="text-slate-300 font-bold truncate" x-text="img.label || `Muestra #${idx + 1}`"></span>
              <span class="text-[10px] text-cyan-400 shrink-0 font-mono">// Clic</span>
            </div>

          </div>
        </template>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="px-6 py-3 border-t border-white/10 bg-black/60 flex items-center justify-between gap-3 shrink-0 text-xs font-mono">
      <span class="text-slate-400 hidden sm:inline text-[11px]">
        // Compatible con giro en 90°, espejado horizontal y vertical, zoom continuo y proporción libre en Cropper.
      </span>

      <button type="button" @click="$store.app.closeMultiImagePicker()"
        class="px-4 py-2 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition-colors cursor-pointer ml-auto">
        Cancelar
      </button>
    </div>

  </div>
</div>
