                    <span class="text-[10px] px-1.5 py-0.2 rounded-full opacity-80"

                            <svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                            <span>APLICAR ESTILO</span>

                              <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                            </svg>
                          </button>

                          </button>

                    <div class="flex items-start justify-between w-full border-b border-white/10 pb-2.5 gap-2">
                      <div class="space-y-1 truncate flex-1">
                        <div class="flex items-center gap-1.5 flex-wrap">
                          <span
                            class="text-[9px] px-1.5 py-0.5 rounded font-mono font-extrabold uppercase tracking-wider flex items-center gap-1"
                            :class="kit.isCustom ? 'bg-purple-500/20 text-purple-300 border border-purple-500/40' : 'bg-cyan-950/90 text-cyan-300 border border-cyan-700/50'"
                            :title="kit.isCustom ? 'Kit personalizado editable' : 'Kit predeterminado del sistema (Solo lectura)'">
                            <i :data-lucide="kit.isCustom ? 'user-check' : 'shield-check'" class="w-2.5 h-2.5"></i>
                            <span x-text="kit.isCustom ? 'CUSTOM' : 'SISTEMA'"></span>
                          </span>

                          <template x-if="$store.settings.isKitActive(kit)">
                            <span
                              class="text-[9px] px-2 py-0.5 rounded-full font-mono font-extrabold tracking-wider bg-emerald-500/20 text-emerald-300 border border-emerald-500/50 flex items-center gap-1 shadow-sm">
                              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                              EN USO
                            </span>
                          </template>
                        </div>

                        <h3 class="text-sm font-extrabold text-white truncate tracking-wide font-title"
                          x-text="kit.name"></h3>
                      </div>

                      <div
                        class="flex items-center gap-1 bg-black/70 px-2 py-1 rounded-lg border border-white/10 shrink-0 shadow-inner"
                        title="Paleta cromática (6 Canales)">
                        <template x-for="swatch in $store.settings.getKitPalette(kit)" :key="swatch.label">
                          <span
                            class="w-3.5 h-3.5 rounded-full border border-white/30 shadow-sm shrink-0 transition-transform hover:scale-125 cursor-help"
                            :style="'background-color: ' + swatch.color + '; box-shadow: 0 0 4px ' + swatch.color + '40;'"
                            :title="swatch.label + ': ' + swatch.color"></span>
                        </template>
                      </div>
                    </div>

                    <!-- Summary of Fonts (5 Niveles) -->
                    <div
                      class="space-y-1 text-xs text-ink-slate font-mono bg-black/55 p-2.5 rounded-xl border border-white/10">
                      <div class="truncate flex items-center justify-between gap-2">
                        <span class="text-accent-cyan font-bold text-[10px] uppercase">Display:</span>
                        <span class="text-parchment-cream truncate text-right font-bold text-[11px]"
                          :style="'font-family: ' + (kit.fontDisplay || 'inherit') + ', sans-serif;'"
                          x-text="kit.fontDisplay || 'Standard'"></span>
                      </div>
                      <div class="truncate flex items-center justify-between gap-2">
                        <span class="text-purple-400 font-bold text-[10px] uppercase">HUD:</span>
                        <span class="text-parchment-cream truncate text-right font-medium text-[11px]"
                          :style="'font-family: ' + (kit.fontHud || 'inherit') + ', sans-serif;'"
                          x-text="kit.fontHud || 'Standard'"></span>
                      </div>
                      <div class="truncate flex items-center justify-between gap-2">
                        <span class="text-emerald-400 font-bold text-[10px] uppercase">Body:</span>
                        <span class="text-parchment-cream truncate text-right font-medium text-[11px]"
                          :style="'font-family: ' + (kit.fontBody || 'inherit') + ', sans-serif;'"
                          x-text="kit.fontBody || 'Standard'"></span>
                      </div>
                      <div class="truncate flex items-center justify-between gap-2">
                        <span class="text-amber-400 font-bold text-[10px] uppercase">Input:</span>
                        <span class="text-parchment-cream truncate text-right font-mono text-[10px]"
                          :style="'font-family: ' + (kit.fontInput || 'inherit') + ', monospace;'"
                          x-text="kit.fontInput || 'Standard'"></span>
                      </div>
                      <div class="truncate flex items-center justify-between gap-2">
                        <span class="text-rose-400 font-bold text-[10px] uppercase">Tier List:</span>
                        <span class="text-parchment-cream truncate text-right font-bold text-[10px]"
                          :style="'font-family: ' + (kit.fontTierlist || kit.fontDisplay || 'inherit') + ', sans-serif;'"
                          x-text="kit.fontTierlist || kit.fontDisplay || 'Standard'"></span>
                      </div>
                    </div>

                    <!-- Especificaciones Rápidas -->
                    <div class="flex items-center justify-between gap-2 text-[10px] font-mono text-ink-slate px-1">
                      <span class="flex items-center gap-1.5" title="Densidad de interfaz">
                        <i data-lucide="layers" class="w-3 h-3 text-ink-slate"></i>
                        <span>Densidad:</span>
                        <span class="text-parchment-cream font-bold uppercase"
                          x-text="(kit.density === 'compact') ? 'Compacta' : ((kit.density === 'comfortable') ? 'Cómoda' : 'Normal')"></span>
                      </span>
                      <span class="flex items-center gap-1.5" title="Geometría de esquinas">
                        <i data-lucide="square" class="w-3 h-3 text-ink-slate"></i>
                        <span>Bisel:</span>
                        <span class="text-parchment-cream font-bold uppercase"
                          x-text="(kit.cornerStyle === 'sharp') ? 'Recto' : ((kit.cornerStyle === 'rounded') ? 'Curvo' : 'Bisel')"></span>
                      </span>
                    </div>

                    <!-- Bottom Action Bar -->
                    <div class="flex items-center justify-between gap-1 pt-2 border-t border-white/10 text-xs font-mono">
                      <template x-if="$store.settings.isKitActive(kit)">
                        <span
                          class="px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-mono shadow-sm cursor-default select-none">
                          <i data-lucide="check-check" class="w-3.5 h-3.5 text-emerald-400"></i>
                          <span>En Uso</span>
                        </span>
                      </template>
                      <template x-if="!$store.settings.isKitActive(kit)">
                        <button type="button" @click="$store.settings.applyThemeKit(kit)"
                          @mouseenter="isApplyHovered = true" @mouseleave="isApplyHovered = false"
                          class="px-3 py-1.5 rounded-lg font-bold transition-all flex items-center gap-1.5 cursor-pointer shadow-sm hover:brightness-110"
                          :style="'border: 1px solid ' + (kit.color || '#00F0FF') + '60; background: ' + (kit.color || '#00F0FF') + '20; color: ' + (kit.color || '#00F0FF')"
                          title="Aplicar este kit visual a toda la aplicación">
                          <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                          <span>Aplicar</span>
                        </button>
                      </template>

                      <!-- Action Icons Group -->
                      <div class="flex items-center gap-1">
                        <button type="button" @click="$store.settings.duplicateKit(kit)"
                          class="p-1.5 rounded-lg bg-white/5 hover:bg-white/15 text-parchment-cream/80 hover:text-white transition-all cursor-pointer"
                          :title="kit.isCustom ? 'Duplicar kit personalizado' : 'Clonar como Kit Personalizado'">
                          <i data-lucide="copy" class="w-3.5 h-3.5 text-accent-gold"></i>
                        </button>

                        <button type="button" @click="$store.settings.openExportKit(kit)"
                          class="p-1.5 rounded-lg bg-white/5 hover:bg-white/15 text-parchment-cream/80 hover:text-white transition-all cursor-pointer"
                          title="Exportar código JSON del kit">
                          <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
                        </button>

                        <template x-if="kit.isCustom">
                          <div class="flex items-center gap-1">
                            <button type="button" @click="$store.settings.openDesigner(kit)"
                              class="p-1.5 rounded-lg bg-purple-500/20 hover:bg-purple-500 hover:text-white text-purple-300 transition-all cursor-pointer"
                              title="Editar este kit custom">
                              <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                            </button>
                            <button type="button" @click="$store.settings.deleteCustomKit(kit.id)"
                              class="p-1.5 rounded-lg bg-rose-500/20 hover:bg-rose-500 hover:text-white text-rose-300 transition-all cursor-pointer"
                              title="Eliminar kit custom">
                              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                          </div>
                        </template>
                      </div>
                    </div>

                  </div>
                </template>

                <!-- Tarjeta Integrada en la Grid: "+ Crear Kit Custom" -->
                <div
                  x-show="$store.settings.kitCategoryFilter === 'all' || $store.settings.kitCategoryFilter === 'custom'"
                  @click="$store.settings.openDesigner()"
                  class="p-5 rounded-2xl border-2 border-dashed border-purple-500/30 hover:border-purple-400 bg-purple-950/10 hover:bg-purple-950/25 transition-all flex flex-col items-center justify-center gap-3 text-center cursor-pointer group shadow-lg min-h-[220px]">
                  <div
                    class="w-12 h-12 rounded-2xl bg-purple-500/20 border border-purple-500/40 flex items-center justify-center text-purple-300 group-hover:scale-110 group-hover:bg-purple-500 group-hover:text-white transition-all shadow-md">
                    <i data-lucide="plus" class="w-6 h-6"></i>
                  </div>
                  <div class="space-y-1">
                    <h4
                      class="font-title text-sm font-bold text-purple-200 group-hover:text-white transition-colors tracking-wide">
                      + Crear Kit Custom</h4>
                    <p class="text-[11px] text-ink-slate font-sans max-w-[200px] leading-tight">Diseña tu paleta
                      cromática de 6 canales y jerarquía de 5 tipografías.</p>
                  </div>
                  <span
                    class="text-[10px] font-mono font-bold px-2.5 py-1 rounded-lg bg-purple-500/20 text-purple-300 border border-purple-500/40 group-hover:bg-purple-500/30 transition-all">Abrir
                    Diseñador</span>
                </div>
              </div>

              <!-- State Empty: Si no se encuentran resultados -->
              <template
                x-if="$store.settings.filteredThemeKits.length === 0 && $store.settings.kitCategoryFilter !== 'all' && $store.settings.kitCategoryFilter !== 'custom'">
                <div
                  class="py-12 text-center bg-black/40 border border-parchment-brown/20 rounded-2xl space-y-3">
                  <i data-lucide="search-x" class="w-10 h-10 text-ink-slate mx-auto opacity-60"></i>
                  <p class="text-sm text-text-muted font-mono">No se encontraron kits que coincidan con la búsqueda.</p>
                  <button type="button"
                    @click="$store.settings.kitSearchQuery = ''; $store.settings.kitCategoryFilter = 'all'"
                    class="text-xs text-accent-cyan font-mono hover:underline cursor-pointer">
                    [ Limpiar Filtros ]
                  </button>
                </div>
              </template>

            </div>

          </div>
